        function hexToRgbA(hex, alpha) {
            var c;
            if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
                c = hex.substring(1).split('');
                if (c.length == 3) {
                    c = [c[0], c[0], c[1], c[1], c[2], c[2]];
                }
                c = '0x' + c.join('');
                return 'rgba(' + [(c >> 16) & 255, (c >> 8) & 255, c & 255].join(',') + ',' + alpha + ')';
            }
            throw new Error('Bad Hex');
        }

        function printCanvas() {
            new AwesomeQR.AwesomeQR({
                text: qrOptions.text,

                correctLevel: qrOptions.correctLevel,
                maskPattern: qrOptions.maskPattern, // 0-7

                protectorOpaque: qrOptions.protectorOpaque,
                autoColor: qrOptions.autoColor,
                colorDark: qrOptions.colorDark,
                colorLight: qrOptions.colorLight,

                }
            );

        document.getElementById("size").value = qrOptions.size;
        document.getElementById("margin").value = qrOptions.margin;
        document.getElementById('correctLevel').value = qrOptions.correctLevel;

        //  document.getElementById("textInput").focus();

        background = "./img/logob.png";
        printCanvas();

        // Live readability check: re-decode the rendered output with jsQR
        // every second and only touch the DOM when the result actually flips,
        // so you can spot a broken QR without pulling out a phone.
        var lastReadable = null;
        function checkReadability() {
            var imgEl = document.getElementById("qrOutput");
            var videoEl = document.getElementById("qrOutputVideo");
            var source = videoEl && !videoEl.hidden ? videoEl : imgEl;
            var w = source.videoWidth || source.naturalWidth;
            var h = source.videoHeight || source.naturalHeight;
            if (!w || !h) return;
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext("2d");
            var imageData;
            try {
                ctx.drawImage(source, 0, 0, w, h);
                imageData = ctx.getImageData(0, 0, w, h);
            } catch (e) {
                return;
            }
            var result = window.jsQR(imageData.data, w, h);
            var readable = Boolean(result && result.data === qrOptions.text);
            if (readable === lastReadable) return;
            lastReadable = readable;
            var readableEl = document.getElementById("readable");
            if (!readableEl) return;
            var picto = readableEl.querySelector("ui-picto");
            if (picto) picto.setAttribute("value", readable ? "eye" : "eye-off");
            readableEl.style.color = readable ? "" : "#000";
        }
        setInterval(checkReadability, 1000);

    <script type="module">
        import { App } from "/42/api/os/App.js"
        import { fs } from "/42/api/fs.js"
        import { prompt, alert } from "/42/ui/layout/dialog.js"

        const app = new App()

        const IMAGE_FILE_TYPES = [{ description: "Image", accept: "image/*" }]
        const VIDEO_FILE_TYPES = [{ description: "Video", accept: "video/*" }]
        const PROJECT_FILE_TYPES = [
            { description: "QRStudio Project", accept: { "application/json": [".qrs"] } },
        ]

        // Rendered video (Format = Video), regenerated by renderVideo(), not persisted in .qrs
        let latestVideoBlob = null
        let latestVideoExt = "webm"

        // Background crop/zoom (Instagram-style cover crop)
        const BG_CROP_SIZE = 800
        let bgSourceImage = null
        let bgZoom = 1
        let bgPanX = 0
        let bgPanY = 0
        let bgCropCanvas, bgCropCtx
        let bgDragging = false
        let bgDragStart = null

        // "background" or "logo": which field the next picked file goes to
        let importPurpose = "background"

        // Animated GIF support: raw bytes kept alongside the static preview
        // (background/logoImage always hold just the first frame, used as-is
        // by the normal live preview). Only touched by "Render GIF".
        let backgroundGifBuffer = null
        let logoGifBuffer = null

        function isGifFile(file) {
            return Boolean(file) && (file.type === "image/gif" || /\.gif$/i.test(file.name || ""))
        }

        function computeBgLayout() {
            const iw = bgSourceImage.naturalWidth
            const ih = bgSourceImage.naturalHeight
            const coverScale = Math.max(BG_CROP_SIZE / iw, BG_CROP_SIZE / ih)
            const scale = coverScale * bgZoom
            const drawW = iw * scale
            const drawH = ih * scale
            const minX = BG_CROP_SIZE - drawW
            const minY = BG_CROP_SIZE - drawH
            let dx = Math.min(0, Math.max(minX, (BG_CROP_SIZE - drawW) / 2 + bgPanX))
            let dy = Math.min(0, Math.max(minY, (BG_CROP_SIZE - drawH) / 2 + bgPanY))
            // Re-sync pan with the clamped position so the next relative drag stays consistent
            bgPanX = dx - (BG_CROP_SIZE - drawW) / 2
            bgPanY = dy - (BG_CROP_SIZE - drawH) / 2
            return { drawW, drawH, dx, dy }
        }

        // Floyd-Steinberg dithering: converts the cropped background to a
        // pure black/white halftone pattern (like newsprint), applied in
        // place on the crop canvas before it's handed off as backgroundImage.
        // In-place Floyd-Steinberg error-diffusion dither of a single channel.
        function ditherChannel(channel, size) {
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const idx = y * size + x
                    const oldVal = channel[idx]
                    const newVal = oldVal < 128 ? 0 : 255
                    const err = oldVal - newVal
                    channel[idx] = newVal
                    if (x + 1 < size) channel[idx + 1] += err * 7 / 16
                    if (y + 1 < size) {
                        if (x - 1 >= 0) channel[idx + size - 1] += err * 3 / 16
                        channel[idx + size] += err * 5 / 16
                        if (x + 1 < size) channel[idx + size + 1] += err * 1 / 16
                    }
                }
            }
        }

        // color=false: grayscale then dither (classic black/white halftone).
        // color=true: dither R/G/B independently, keeping the image's hues.
        function ditherFloydSteinberg(ctx, size, color) {
            const imageData = ctx.getImageData(0, 0, size, size)
            const data = imageData.data
            if (color) {
                const r = new Float32Array(size * size), g = new Float32Array(size * size), b = new Float32Array(size * size)
                for (let i = 0; i < size * size; i++) {
                    r[i] = data[i * 4], g[i] = data[i * 4 + 1], b[i] = data[i * 4 + 2]
                }
                ditherChannel(r, size), ditherChannel(g, size), ditherChannel(b, size)
                for (let i = 0; i < size * size; i++) {
                    data[i * 4] = r[i], data[i * 4 + 1] = g[i], data[i * 4 + 2] = b[i]
                }
            } else {
                const gray = new Float32Array(size * size)
                for (let i = 0; i < size * size; i++) {
                    gray[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2]
                }
                ditherChannel(gray, size)
                for (let i = 0; i < size * size; i++) {
                    data[i * 4] = gray[i], data[i * 4 + 1] = gray[i], data[i * 4 + 2] = gray[i]
                }
            }
            ctx.putImageData(imageData, 0, 0)
        }

        window.renderBgCrop = function renderBgCrop() {
            if (!bgSourceImage) return
            if (!bgCropCanvas) {
                bgCropCanvas = document.getElementById("bgCropCanvas")
                bgCropCtx = bgCropCanvas.getContext("2d")
                bgCropCtx.imageSmoothingEnabled = false
            }
            const { drawW, drawH, dx, dy } = computeBgLayout()
            bgCropCtx.clearRect(0, 0, BG_CROP_SIZE, BG_CROP_SIZE)
            bgCropCtx.drawImage(bgSourceImage, dx, dy, drawW, drawH)
            if (document.getElementById("bgHalftone").checked) {
                ditherFloydSteinberg(bgCropCtx, BG_CROP_SIZE, document.getElementById("bgHalftoneColor").checked)
            }
            background = bgCropCanvas.toDataURL()
            printCanvas()
        }

        function loadBackgroundFromURL(url, cropState) {
            const img = new Image()
            img.onload = () => {
                bgSourceImage = img
                bgZoom = cropState?.zoom ?? 1
                bgPanX = cropState?.panX ?? 0
                bgPanY = cropState?.panY ?? 0
                document.getElementById("bgZoom").value = bgZoom
                renderBgCrop()
            }
            img.src = url
        }

        window.onBgZoomChange = function () {
            bgZoom = parseFloat(document.getElementById("bgZoom").value)
            renderBgCrop()
        }

        window.resetBgCrop = function () {
            bgZoom = 1
            bgPanX = 0
            bgPanY = 0
            document.getElementById("bgZoom").value = 1
            renderBgCrop()
        }

        function bgPointerDown(e) {
            if (!bgSourceImage) return
            bgDragging = true
            bgCropCanvas.classList.add("dragging")
            bgCropCanvas.setPointerCapture(e.pointerId)
            bgDragStart = { x: e.clientX, y: e.clientY, panX: bgPanX, panY: bgPanY }
        }

        function bgPointerMove(e) {
            if (!bgDragging) return
            const rect = bgCropCanvas.getBoundingClientRect()
            const scaleFactor = BG_CROP_SIZE / rect.width
            bgPanX = bgDragStart.panX + (e.clientX - bgDragStart.x) * scaleFactor
            bgPanY = bgDragStart.panY + (e.clientY - bgDragStart.y) * scaleFactor
            renderBgCrop()
        }

        function bgPointerUp() {
            bgDragging = false
            if (bgCropCanvas) bgCropCanvas.classList.remove("dragging")
        }

        const bgCropCanvasEl = document.getElementById("bgCropCanvas")
        bgCropCanvasEl.addEventListener("pointerdown", bgPointerDown)
        bgCropCanvasEl.addEventListener("pointermove", bgPointerMove)
        bgCropCanvasEl.addEventListener("pointerup", bgPointerUp)
        bgCropCanvasEl.addEventListener("pointercancel", bgPointerUp)

        // Import (background image / logo / project) through the windows93 file
        // picker, same mechanism as QRDrop: app.openFile() resolves a FileAgent
        // through the "decode" event, routed here by the pending importPurpose.
        app.on("decode", async (fileAgent) => {
            if (importPurpose === "project") {
                try {
                    await applyProjectData(JSON.parse(await fileAgent.getText()))
                } catch (err) {
                    console.error("Failed to load .qrs project", err)
                }
                return
            }

            const isGif = /\.gif$/i.test(fileAgent.getName() || "")
            const url = await fileAgent.getURL()
            if (importPurpose === "logo") {
                logoGifBuffer = isGif ? await fileAgent.getArrayBuffer() : null
                logoImage = url
                printCanvas()
            } else {
                backgroundGifBuffer = isGif ? await fileAgent.getArrayBuffer() : null
                loadBackgroundFromURL(url)
            }
        })

        window.previewFile = async function () {
            importPurpose = "background"
            await app.openFile()
        }

        window.previewFileLogo = async function () {
            importPurpose = "logo"
            await app.openFile()
        }

        // Import (local disk, outside the browser's virtual filesystem)
        function readImageFile(file, onLoaded) {
            if (!file) return
            const reader = new FileReader()
            reader.onload = () => onLoaded(reader.result)
            reader.readAsDataURL(file)
        }

        const backgroundImportInput = document.getElementById("backgroundImportInput")
        backgroundImportInput.addEventListener("change", async () => {
            const file = backgroundImportInput.files[0]
            backgroundImportInput.value = ""
            if (!file) return
            backgroundGifBuffer = isGifFile(file) ? await file.arrayBuffer() : null
            readImageFile(file, loadBackgroundFromURL)
        })

        const logoImportInput = document.getElementById("logoImportInput")
        logoImportInput.addEventListener("change", async () => {
            const file = logoImportInput.files[0]
            logoImportInput.value = ""
            if (!file) return
            logoGifBuffer = isGifFile(file) ? await file.arrayBuffer() : null
            readImageFile(file, (url) => {
                logoImage = url
                printCanvas()
            })
        })

        window.importFile = function () {
            backgroundImportInput.click()
        }

        window.importFileLogo = function () {
            logoImportInput.click()
        }

        const projectImportInput = document.getElementById("projectImportInput")
        projectImportInput.addEventListener("change", async () => {
            const file = projectImportInput.files[0]
            projectImportInput.value = ""
            if (!file) return
            try {
                await applyProjectData(JSON.parse(await file.text()))
            } catch (err) {
                console.error("Failed to load .qrs project", err)
            }
        })

        window.importProject = function () {
            projectImportInput.click()
        }

        window.removeBackground = function () {
            bgSourceImage = null
            bgZoom = 1
            bgPanX = 0
            bgPanY = 0
            document.getElementById("bgZoom").value = 1
            if (bgCropCtx) bgCropCtx.clearRect(0, 0, BG_CROP_SIZE, BG_CROP_SIZE)
            background = undefined
            backgroundGifBuffer = null
            printCanvas()
        }

        window.removeLogo = function () {
            logoImage = undefined
            logoGifBuffer = null
            printCanvas()
        }

        window.onOutputFormatChange = function () {
            const format = document.getElementById("outputFormat").value
            document.getElementById("renderOutput").disabled = format === "png"
            document.getElementById("videoLoops").style.display = format === "video" ? "" : "none"
            if (format === "png") {
                document.getElementById("qrOutputVideo").hidden = true
                document.getElementById("qrOutput").hidden = false
                printCanvas()
            }
        }
        onOutputFormatChange()

        window.renderOutput = function () {
            const format = document.getElementById("outputFormat").value
            if (format === "gif") return renderGif()
            if (format === "video") return renderVideo()
        }

        // Shared by renderGif()/renderVideo(): the AwesomeQR options driving
        // the animated result (background and/or logo).
        function buildAnimatedOptions(extra) {
            return Object.assign({
                text: qrOptions.text,
                size: qrOptions.size,
                correctLevel: qrOptions.correctLevel,
                maskPattern: qrOptions.maskPattern,
                version: qrOptions.version,
                backgroundImage: backgroundGifBuffer ? undefined : background,
                gifBackground: backgroundGifBuffer || undefined,
                gifBackgroundZoom: bgZoom,
                gifBackgroundPanX: bgPanX / BG_CROP_SIZE,
                gifBackgroundPanY: bgPanY / BG_CROP_SIZE,
                bgHalftone: document.getElementById("bgHalftone").checked,
                bgHalftoneColor: document.getElementById("bgHalftoneColor").checked,
                components: qrOptions.components,
                margin: qrOptions.margin,
                moduleShape: qrOptions.moduleShape,
                eyeFrameShape: qrOptions.eyeFrameShape,
                eyeBallShape: qrOptions.eyeBallShape,
                lightPixels: qrOptions.lightPixels,
                protectorOpaque: qrOptions.protectorOpaque,
                autoColor: qrOptions.autoColor,
                colorDark: qrOptions.colorDark,
                colorLight: qrOptions.colorLight,
                backgroundDimming: qrOptions.backgroundDimming,
                whiteMargin: qrOptions.whiteMargin,
                logoImage: logoGifBuffer ? undefined : logoImage,
                gifLogo: logoGifBuffer || undefined,
                logoScale: qrOptions.logoScale,
                logoMargin: qrOptions.logoMargin,
                logoCornerRadius: qrOptions.logoCornerRadius,
                logoTransparentBackground: qrOptions.logoTransparentBackground,
            }, extra)
        }

        async function buildAnimatedDataURL() {
            if (!backgroundGifBuffer && !logoGifBuffer) return null
            return new AwesomeQR.AwesomeQR(buildAnimatedOptions()).draw()
        }

        async function renderGif() {
            const dataURL = await buildAnimatedDataURL()
            if (!dataURL) {
                await alert("No GIF loaded for background or logo — pick one via Open/Import first.")
                return
            }
            document.getElementById("qrOutputVideo").hidden = true
            document.getElementById("qrOutput").hidden = false
            document.getElementById("qrOutput").src = dataURL
        }

        function pickSupportedVideoMimeType() {
            if (!window.MediaRecorder) return ""
            const candidates = [
                "video/mp4;codecs=h264",
                "video/mp4",
                "video/webm;codecs=vp9",
                "video/webm;codecs=vp8",
                "video/webm",
            ]
            return candidates.find((c) => MediaRecorder.isTypeSupported(c)) || ""
        }

        // Collects the already-composited frames straight from the same
        // background+logo timeline logic used for GIF export (captureFrames
        // hook in awesome-qr.js), then plays them back ourselves on a canvas
        // with the frames' real delays and records that with MediaRecorder.
        // No reliance on the browser animating an offscreen <img> GIF, which
        // isn't consistently honored.
        async function renderVideo() {
            if (!backgroundGifBuffer && !logoGifBuffer) {
                await alert("No GIF loaded for background or logo — pick one via Open/Import first.")
                return
            }
            if (!window.MediaRecorder || typeof HTMLCanvasElement.prototype.captureStream !== "function") {
                await alert("Video recording isn't supported in this browser.")
                return
            }

            const captureFrames = []
            await new AwesomeQR.AwesomeQR(buildAnimatedOptions({ captureFrames })).draw()
            if (!captureFrames.length) {
                await alert("Nothing to animate.")
                return
            }

            // Preload every frame up front so playback timing isn't skewed by decode time
            const images = await Promise.all(captureFrames.map((f) => new Promise((resolve, reject) => {
                const img = new Image()
                img.onload = () => resolve(img)
                img.onerror = reject
                img.src = f.dataURL
            })))

            const canvas = document.createElement("canvas")
            canvas.width = images[0].naturalWidth
            canvas.height = images[0].naturalHeight
            const ctx = canvas.getContext("2d")
            ctx.imageSmoothingEnabled = false

            const mimeType = pickSupportedVideoMimeType()
            const recorderOptions = { videoBitsPerSecond: 8000000 }
            if (mimeType) recorderOptions.mimeType = mimeType
            const recorder = new MediaRecorder(canvas.captureStream(30), recorderOptions)
            const chunks = []
            recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data) }

            const loops = Math.max(1, parseInt(document.getElementById("videoLoops").value, 10) || 3)

            await new Promise((resolve) => {
                recorder.onstop = resolve
                recorder.start()

                let frameIndex = 0
                let loopCount = 0
                const drawNextFrame = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height)
                    ctx.drawImage(images[frameIndex], 0, 0, canvas.width, canvas.height)
                    const delay = captureFrames[frameIndex].delay
                    frameIndex++
                    if (frameIndex >= images.length) {
                        frameIndex = 0
                        loopCount++
                        if (loopCount >= loops) {
                            setTimeout(() => recorder.stop(), delay)
                            return
                        }
                    }
                    setTimeout(drawNextFrame, delay)
                }
                drawNextFrame()
            })

            latestVideoBlob = new Blob(chunks, { type: mimeType || "video/webm" })
            latestVideoExt = (mimeType || "video/webm").includes("mp4") ? "mp4" : "webm"

            const videoEl = document.getElementById("qrOutputVideo")
            videoEl.width = canvas.width
            videoEl.height = canvas.height
            videoEl.src = URL.createObjectURL(latestVideoBlob)
            videoEl.hidden = false
            document.getElementById("qrOutput").hidden = true
        }

        function outputExtension(dataURL) {
            return dataURL.startsWith("data:image/gif") ? "gif" : "png"
        }

        function isVideoFormat() {
            return document.getElementById("outputFormat").value === "video"
        }

        // Save through the windows93 save-file picker + virtual filesystem
        window.exportCanvas = async function () {
            if (isVideoFormat()) {
                if (!latestVideoBlob) return
                const path = await app.getSavePath({
                    suggestedName: `qrcode.${latestVideoExt}`,
                    types: VIDEO_FILE_TYPES,
                })
                if (!path) return
                await fs.write(path, latestVideoBlob)
                return
            }
            const dataURL = document.getElementById("qrOutput").src
            if (!dataURL) return
            const path = await app.getSavePath({
                suggestedName: `qrcode.${outputExtension(dataURL)}`,
                types: IMAGE_FILE_TYPES,
            })
            if (!path) return
            const blob = await fetch(dataURL).then((r) => r.blob())
            await fs.write(path, blob)
        }

        // Export: download the file to the visitor's computer, name chosen
        // through the windows93 prompt dialog (outside the virtual filesystem)
        window.downloadCanvas = async function () {
            if (isVideoFormat()) {
                if (!latestVideoBlob) return
                const filename = await prompt("File name", { value: `qrcode.${latestVideoExt}` })
                if (!filename) return
                const url = URL.createObjectURL(latestVideoBlob)
                const a = document.createElement("a")
                a.href = url
                a.download = filename
                a.click()
                URL.revokeObjectURL(url)
                return
            }
            const dataURL = document.getElementById("qrOutput").src
            if (!dataURL) return
            const filename = await prompt("File name", { value: `qrcode.${outputExtension(dataURL)}` })
            if (!filename) return
            const blob = await fetch(dataURL).then((r) => r.blob())
            const url = URL.createObjectURL(blob)
            const a = document.createElement("a")
            a.href = url
            a.download = filename
            a.click()
            URL.revokeObjectURL(url)
        }

        // Project (.qrs) serialization: plain JSON, images embedded as base64
        // data URLs so the file is fully self-contained/portable.
        async function toDataURL(url) {
            if (!url) return null
            if (url.startsWith("data:")) return url
            const blob = await fetch(url).then((r) => r.blob())
            return new Promise((resolve, reject) => {
                const reader = new FileReader()
                reader.onload = () => resolve(reader.result)
                reader.onerror = reject
                reader.readAsDataURL(blob)
            })
        }

        function arrayBufferToDataURL(buffer, mime) {
            if (!buffer) return null
            const blob = new Blob([buffer], { type: mime })
            return new Promise((resolve, reject) => {
                const reader = new FileReader()
                reader.onload = () => resolve(reader.result)
                reader.onerror = reject
                reader.readAsDataURL(blob)
            })
        }

        async function dataURLToArrayBuffer(dataURL) {
            if (!dataURL) return null
            return fetch(dataURL).then((r) => r.arrayBuffer())
        }

        async function serializeProject() {
            return {
                format: "qrstudio-project",
                version: 2,
                qrOptions,
                background: await toDataURL(background),
                logoImage: await toDataURL(logoImage),
                backgroundCrop: { zoom: bgZoom, panX: bgPanX, panY: bgPanY },
                bgHalftone: document.getElementById("bgHalftone").checked,
                bgHalftoneColor: document.getElementById("bgHalftoneColor").checked,
                backgroundGif: await arrayBufferToDataURL(backgroundGifBuffer, "image/gif"),
                logoGif: await arrayBufferToDataURL(logoGifBuffer, "image/gif"),
                outputFormat: document.getElementById("outputFormat").value,
            }
        }

        function rgbaToHexAlpha(rgba) {
            const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/.exec(rgba || "")
            if (!m) return { hex: "#000000", alpha: 0 }
            const toHex = (n) => Number(n).toString(16).padStart(2, "0")
            const alpha = m[4] !== undefined ? Math.round(parseFloat(m[4]) * 100) : 100
            return { hex: `#${toHex(m[1])}${toHex(m[2])}${toHex(m[3])}`, alpha }
        }

        function applyProjectToUI() {
            document.getElementById("textInput").value = qrOptions.text
            document.getElementById("size").value = qrOptions.size
            document.getElementById("whiteMargin").checked = qrOptions.whiteMargin
            document.getElementById("margin").value = qrOptions.margin
            document.getElementById("moduleShape").value = qrOptions.moduleShape || "square"
            document.getElementById("eyeShape").value = qrOptions.eyeFrameShape || "square"
            document.getElementById("lightPixels").checked = qrOptions.lightPixels !== false
            document.getElementById("protectorOpaque").checked = Boolean(qrOptions.protectorOpaque)
            document.getElementById("colorDark").value = qrOptions.colorDark
            document.getElementById("colorLight").value = qrOptions.colorLight
            document.getElementById("autoColor").checked = qrOptions.autoColor
            document.getElementById("dataScale").value = qrOptions.components.data.scale
            document.getElementById("timingScale").value = qrOptions.components.timing.scale
            document.getElementById("timingProtectors").checked = qrOptions.components.timing.protectors
            document.getElementById("alignmentScale").value = qrOptions.components.alignment.scale
            document.getElementById("alignmentProtectors").checked = qrOptions.components.alignment.protectors
            document.getElementById("cornerAlignmentScale").value = qrOptions.components.cornerAlignment.scale
            document.getElementById("cornerAlignmentProtectors").checked = qrOptions.components.cornerAlignment.protectors
            document.getElementById("logoScale").value = qrOptions.logoScale
            document.getElementById("logoMargin").value = qrOptions.logoMargin
            document.getElementById("logoCornerRadius").value = qrOptions.logoCornerRadius
            document.getElementById("logoTransparentBackground").checked = qrOptions.logoTransparentBackground
            document.getElementById("correctLevel").value = qrOptions.correctLevel
            document.getElementById("version").value = qrOptions.version
            document.getElementById("maskPattern").value = qrOptions.maskPattern
            const { hex, alpha } = rgbaToHexAlpha(qrOptions.backgroundDimming)
            document.getElementById("backgroundDimming").value = hex
            document.getElementById("backgroundDimmingAlpha").value = alpha
        }

        async function applyProjectData(data) {
            if (!data || typeof data !== "object") throw new Error("Invalid .qrs project file")

            Object.assign(qrOptions, data.qrOptions)
            applyProjectToUI()

            logoImage = data.logoImage || undefined
            logoGifBuffer = await dataURLToArrayBuffer(data.logoGif)

            document.getElementById("bgHalftone").checked = Boolean(data.bgHalftone)
            document.getElementById("bgHalftoneColor").checked = Boolean(data.bgHalftoneColor)

            if (data.background) {
                loadBackgroundFromURL(data.background, data.backgroundCrop)
            } else {
                window.removeBackground()
            }
            backgroundGifBuffer = await dataURLToArrayBuffer(data.backgroundGif)

            // outputFormat is the current field; gifMode is kept for .qrs saved before this version
            document.getElementById("outputFormat").value = data.outputFormat || (data.gifMode ? "gif" : "png")
            onOutputFormatChange()

            printCanvas()
        }

        window.openProject = async function () {
            importPurpose = "project"
            await app.openFile()
        }

        window.savedProject = async function () {
            const data = await serializeProject()
            const path = await app.getSavePath({
                suggestedName: "project.qrs",
                types: PROJECT_FILE_TYPES,
            })
            if (!path) return
            await fs.writeText(path, JSON.stringify(data))
        }

        window.exportProject = async function () {
            const data = await serializeProject()
            const filename = await prompt("File name", { value: "project.qrs" })
            if (!filename) return
            const blob = new Blob([JSON.stringify(data)], { type: "application/json" })
            const url = URL.createObjectURL(blob)
            const a = document.createElement("a")
            a.href = url
            a.download = filename
            a.click()
            URL.revokeObjectURL(url)
        }
    </script>
</body>
