<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="/style.css">
  <style>
    #qrdata {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: auto !important;
      height: 90% !important;
      image-rendering: pixelated;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <script src="/42/core.js"></script>
  <script src="js/riffwave.js"></script>
  <script src="js/sfxr.js"></script>
  <script src="js/qrcode.js"></script>
  <script src="js/webqr.js"></script>

  <div class="fit cols">
    <div class="inset screen" style="overflow:hidden;">
      <canvas id="qrdata"></canvas>
    </div>
    <div class="rows shrink" style="width: 20%;">
      <div id="outdiv" class="shrink" style="transform: scaleX(-1);">
        <video id="v" autoplay width="100%"></video>
      </div>
      <textarea id="console" cols="30" rows="10"></textarea>
    </div>
  </div>

  <script>load()</script>
  <script type="module">
    import { App } from "/42/api/os/App.js"
    import { fs } from "/42/api/fs.js"

    const CHUNK_SIZE = 300
    const app = new App()

    const log = msg => document.getElementById('console').value += '\n' + msg

    let chunkIndex = 0
    let payloads = []
    let exportMode = false

    window.sendingData = false
    window.receivingData = false
    window.currentData = null
    window.previousChunk = null
    window.rxChunks = {}
    window.rxTotal = null
    window.rxReceivedCount = 0
    window.rxMeta = null

    function buildQRPayloads(bytes, filename) {
      const dataChunks = []
      for (let i = 0; i < bytes.length; i += CHUNK_SIZE) {
        const slice = bytes.slice(i, i + CHUNK_SIZE)
        let binary = ''
        for (const b of slice) binary += String.fromCharCode(b)
        dataChunks.push(btoa(binary))
      }
      const n = dataChunks.length
      const meta = { i: -1, n, d: btoa(unescape(encodeURIComponent(JSON.stringify({ filename })))) }
      return [meta, ...dataChunks.map((d, i) => ({ i, n, d }))]
    }

    window.nextChunk = function nextChunk() {
      if (!payloads.length) return
      if (chunkIndex >= payloads.length) {
        if (chunkIndex === payloads.length) {
          log('File Transfer Complete!')
          boopDone.getAudio().play()
          const c = document.getElementById('qrdata')
          c.getContext('2d').clearRect(0, 0, c.width, c.height)
          chunkIndex++
        }
        return
      }
      window.currentData = JSON.stringify(payloads[chunkIndex])
      printCanvas(window.currentData)
      boopSend.getAudio().play()
      chunkIndex++
      log('Sending: ' + chunkIndex + '/' + payloads.length)
    }

    function clearQRCanvas() {
      const c = document.getElementById('qrdata')
      const ctx = c.getContext('2d')
      ctx.fillStyle = '#000'
      ctx.fillRect(0, 0, c.width, c.height)
    }

    function resetSender() {
      clearQRCanvas()
      window.sendingData = false
      chunkIndex = 0
      payloads = []
      window.currentData = null
    }

    function resetReceiver() {
      clearQRCanvas()
      window.receivingData = true
      window.previousChunk = null
      window.rxChunks = {}
      window.rxTotal = null
      window.rxReceivedCount = 0
      window.rxMeta = null
    }

    app.on('decode', async (fileAgent) => {
      resetSender()
      window.sendingData = true
      const url = await fileAgent.getURL()
      const bytes = new Uint8Array(await fetch(url).then(r => r.arrayBuffer()))
      const filename = url.split('/').pop()
      payloads = buildQRPayloads(bytes, filename)
      document.getElementById('console').value = 'Sending: ' + filename
      nextChunk()
    })

    app.on('receive', () => {
      resetSender()
      resetReceiver()
      document.getElementById('console').value = 'Waiting for a QR code…'
    })

    app.on('exportMode', (mode) => {
      exportMode = mode
    })

    window.saveReceivedFile = async function(blob, filename) {
      if (exportMode) {
        const url = URL.createObjectURL(blob)
        const a = document.createElement("a")
        a.href = url
        a.download = filename || "received_file"
        a.click()
      } else {
        const path = await app.getSavePath({ suggestedName: filename })
        if (!path) return
        await fs.write(path, await blob.arrayBuffer())
        log('Saved: ' + path)
      }
    }
  </script>
</body>

</html>
