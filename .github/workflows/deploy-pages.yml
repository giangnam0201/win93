name: Deploy WINDOWS93 apps to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'tools/build_pages.py'
      - 'tools/pages-assets.json'
      - 'tools/restore.py'
      - '42/**'
      - 'bios/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - 'files.cbor'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify compressed asset loader
        run: |
          node tools/test-page-assets.mjs
          node tools/test-file-index.mjs
      - name: Restore verified app assets using public release links
        run: python tools/build_pages.py
      - name: Publish generated site to its Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -b codex/pages-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!gh auth git-credential'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code origin refs/heads/codex/pages-assets >/dev/null; then
            git fetch --depth=1 origin codex/pages-assets
            git reset --soft FETCH_HEAD
          fi
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Publish WINDOWS93 app bundle from $GITHUB_SHA"
          git push origin HEAD:codex/pages-assets
      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
